output "BOE NE135A1M-NY1 Unknown" {
    alias $AWA_INTERNAL

    mode 2880x1920@120.000
    scale 2.2857142

    transform "normal"
}

output "PNP(AOC) 2367 AAAE59A002292" {
    alias $AOC

    mode 1920x1080@60.0000
    scale 1.5
}


profile mobile {
    output $AWA_INTERNAL enable position 0,0
}

profile extended {
    output $AWA_INTERNAL enable position 1280,0
    output $AOC enable position 0,120
}
