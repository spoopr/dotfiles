output "BOE NE135A1M-NY1 Unknown" {
    alias $AWA_INTERNAL

    mode 2880x1920@120.000
    scale 2.2857142

    transform "normal"
}

output "PNP(AOC) 2367 AAAE59A002292" {
    alias $AOC

    mode 1920x1080@60.0000
    scale 1.5
}

output "PNP(GWD) ARZOPA 2022110200001" {
    alias $Z3FC

    mode 2560x1440@164.998
    scale 2
}



profile mobile {
    output $AWA_INTERNAL enable position 0,0
}

profile extended {
    output $AWA_INTERNAL enable position 0,0
    output $Z3FC enable position 1280,0
}

profile half-dock {
    output $AWA_INTERNAL enable position 0,0
    output $AOC enable position 1280,120
}

profile full-dock {
    output $AWA_INTERNAL disable
    output $Z3FC enable position 0,0
    output $AOC enable position 1280,120
}
